name: CI

on:
  push:
    # `beta` is the integration branch where work lands; `main` only ever
    # receives a merge from it at release time. Both are gated — without beta
    # here, merges into it would run unchecked and main would inherit the mess.
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # shortcut: pinned — 26.04 runners block bwrap's nested userns (apply-seccomp: setgroups EPERM); unpin once linux-sandbox-deps handles 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-sandbox-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make check
