name: CI

on:
  push:
    # `beta` is the integration branch where work lands; `main` only ever
    # receives a merge from it at release time. Both are gated — without beta
    # here, merges into it would run unchecked and main would inherit the mess.
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the run already going for it.
# Pushes to main and beta each get a group of their own (the run id), so
# none is ever cancelled or queued behind another: a shared group would
# still drop a queued run when a newer one arrived.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/linux-sandbox-deps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make check

  # The image is built and booted, not just the code: a runtime stage that
  # missed a file next.config.ts imports shipped containers that died at boot
  # while every other check stayed green. One web and two workers must reach
  # healthy; see the check-compose target.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make check-compose
