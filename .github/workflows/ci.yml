name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-sandbox-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make check
