name: CodeQL

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # A job-level `permissions:` block REPLACES the workflow-level one rather
      # than merging with it, so `contents: read` has to be restated here —
      # without it `actions/checkout` cannot read this private repo and fails
      # with a misleading "Repository not found".
      contents: read
      # codeql-action reads the workflow run via the Actions API when it
      # uploads results; on a private repo that needs an explicit grant, or
      # analyze fails with "Resource not accessible by integration".
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # Includes TypeScript and the security-and-quality query pack.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
