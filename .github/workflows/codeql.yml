name: CodeQL

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # A job-level `permissions:` block REPLACES the workflow-level one rather
      # than merging with it, so `contents: read` has to be restated here —
      # without it `actions/checkout` cannot read this private repo and fails
      # with a misleading "Repository not found".
      contents: read
      # codeql-action reads the workflow run via the Actions API when it
      # uploads results; on a private repo that needs an explicit grant, or
      # analyze fails with "Resource not accessible by integration".
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          # Includes TypeScript and the security-and-quality query pack.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
