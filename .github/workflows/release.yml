name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # `make check` below runs the real sandbox suite, same as CI.
      - uses: ./.github/actions/linux-sandbox-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make install
      # Gate the release on the same suite CI runs — never publish a red tag.
      - run: make check
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
