name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `make check` below runs the real sandbox suite, same as CI.
      - uses: ./.github/actions/linux-sandbox-deps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      # Gate the release on the same suite CI runs — never publish a red tag.
      - run: make check
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A hyphen in the tag marks a SemVer prerelease (v1.1.0-beta.1). `gh`
        # does not infer that from the tag, and GitHub shows the newest
        # non-prerelease as "Latest" — without the flag a beta would displace
        # the current stable release on the repo page.
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
