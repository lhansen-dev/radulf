version: 2

# Dependency PRs open against `beta`, not `main`. Under the stable-main /
# beta-integration model, `main` only receives a merge from `beta` at release
# time, so a PR based on `main` is based on a tree nothing is developed against
# — its CI runs against stale code and its lockfile conflicts on the way in.
#
# Note: Dependabot reads this file from the repository's DEFAULT branch (main).
# Changing it on `beta` alone has no effect until `beta` is merged to `main`.
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine patch/minor churn to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors land as their own PRs so the CI break is easy to attribute.

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: weekly
