version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine patch/minor churn to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors land as their own PRs so the CI break is easy to attribute.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
